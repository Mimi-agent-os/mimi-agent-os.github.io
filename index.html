<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mimi-os — coming soon</title>
<meta name="description" content="mimi-os — a personal agent runtime. Coming soon.">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="mimi-os">
<meta property="og:description" content="A personal agent runtime. Coming soon.">
<meta property="og:image" content="mimi-mascot.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#08080a; --panel:#101014;
  --ink:#f5f5f8; --ink-2:#a6a6b3; --ink-3:#9292a2;
  --line:#242430;
  --accent:oklch(.9 .075 163);
  --tint-accent:color-mix(in oklab, var(--accent) 16%, transparent);
  --sans:'Public Sans', ui-sans-serif, system-ui, sans-serif;
  --brand:Quicksand, var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:32px;
  overflow:hidden;
}
/* soft accent bloom behind the mascot */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60vmin 60vmin at 50% 38%, var(--tint-accent), transparent 70%);
}
main{position:relative;text-align:center;max-width:36rem;animation:rise .8s cubic-bezier(.22,1,.36,1) both}
.mascot{
  width:min(52vmin,232px);height:auto;display:block;margin:0 auto 28px;
  filter:drop-shadow(0 28px 48px rgba(0,0,0,.6));
  animation:float 6s ease-in-out infinite;
}
h1{
  font:700 clamp(2.6rem,11vmin,4.4rem)/1 var(--brand);
  letter-spacing:-.03em;margin:0;
}
.tagline{margin:14px 0 0;color:var(--ink-2);font-size:clamp(.95rem,3.4vmin,1.05rem)}
.badge{
  display:inline-flex;align-items:center;gap:8px;margin-top:30px;
  padding:8px 16px;border-radius:999px;
  background:var(--tint-accent);color:var(--accent);
  border:1px solid color-mix(in oklab, var(--accent) 40%, transparent);
  font:600 12px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
footer{
  position:fixed;bottom:22px;left:0;right:0;text-align:center;
  font-size:13px;color:var(--ink-3);
}
footer a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink);border-bottom-color:var(--ink-3)}

@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <img class="mascot" src="mimi-mascot.png" alt="mimi-os mascot" width="512" height="512">
  <h1>mimi-os</h1>
  <p class="tagline">A personal agent runtime.</p>
  <div class="badge"><span class="dot"></span>Coming soon</div>
</main>
<footer><a href="https://github.com/Mimi-agent-os/mimi-agent-os">github.com/Mimi-agent-os/mimi-agent-os</a></footer>
</body>
</html>
